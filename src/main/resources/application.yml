server:
  port: 8081


spring:
  whale:
    i18n:
      enabled: false
  application:
    name: jp-cn-dict
  messages:
    encoding: UTF-8
    fallback-to-system-locale: false
    use-code-as-default-message: false
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB
  thymeleaf:
    cache: false
  web:
    resources:
      cache:
        cachecontrol:
          max-age: 0
      chain:
        cache: false
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/jpcndict
    username: postgres
    password: s19941129
    druid:
      initial-size: 5
      max-active: 20
      min-idle: 5
      max-wait: 60000
      stat-view-servlet:
        enabled: true
        login-username: admin
        login-password: 123456
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  ai:
    deepseek:
      api-key: ${ARK_API_KEY:}
      base-url: https://ark.cn-beijing.volces.com/api/v3
      chat:
        options:
          model: deepseek-v4-flash-260425
          temperature: 0.1 # 降低随机性，抽取结果稳定
          timeout: 60000 # 60秒超时释放连接
          top-p: 0.3 # 进一步压缩采样范围，减少自由发挥
          max-tokens: 4096 # 限制单次返回长度，避免超长冗余内容