server:
  port: 8081


spring:
  whale:
    i18n:
      enabled: false
  application:
    name: jp-cn-dict
  messages:
    encoding: UTF-8
    fallback-to-system-locale: false
    use-code-as-default-message: false
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB
  thymeleaf:
    cache: false
  web:
    resources:
      cache:
        cachecontrol:
          max-age: 0
      chain:
        cache: false
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/jpcndict
    username: postgres
    password: s19941129
    druid:
      initial-size: 5
      max-active: 20
      min-idle: 5
      max-wait: 60000
      stat-view-servlet:
        enabled: true
        login-username: admin
        login-password: 123456

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true