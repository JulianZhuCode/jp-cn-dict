server:
  port: 8081

spring:
  application:
    name: jp-cn-dict
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/jpcndict
    username: postgres
    password: s19941129
    druid:
      initial-size: 5
      max-active: 20
      min-idle: 5
      max-wait: 60000
      stat-view-servlet:
        enabled: true
        login-username: admin
        login-password: 123456

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  whale:
    rbac:
      security:
        permit-all-urls:
          - /api/rbac/auth/**
          - /api/rbac/public/**
        csrf-enabled: false
        cors-enabled: true
        token-prefix: "Bearer "
        token-header: "Authorization"
        allowed-origin-patterns:
          - "*"
        jwt:
          secret: SpringWhaleRBACSecretKey2024ForJWTTokenGenerationMustBeLongEnough
          expiration: 86400000