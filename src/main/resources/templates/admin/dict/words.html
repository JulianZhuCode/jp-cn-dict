<!DOCTYPE html>
<html layout:decorate="~{admin/layout}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Words</title>
</head>

<body>

<main layout:fragment="content">
    <th:block th:replace="~{admin/fragments/data-table :: table(
        title='Words',
        description='Manage Japanese-Chinese dictionary words',
        createUrl='#',
        createModal='word-modal',
        createPermission='dict:word:create',
        items=${words},
        emptyMessage='No words found',
        baseUrl='/admin/dict/words',
        page=${page},
        colspan=8,
        headers=~{::#word-headers},
        rows=~{::#word-row}
    )}">
        <th:block id="word-headers">
            <th>ID</th>
            <th>Word</th>
            <th>Reading</th>
            <th>Romaji</th>
            <th>Meaning</th>
            <th>POS</th>
            <th>Notes</th>
            <th>Actions</th>
        </th:block>
        <th:block id="word-row">
            <td th:text="${item.id}">1</td>
            <td><strong th:text="${item.word}">食べる</strong></td>
            <td th:text="${item.reading}">たべる</td>
            <td th:text="${item.romaji}">taberu</td>
            <td>
                <span th:each="m,iterStat : ${item.meaning}"
                      th:if="${item.meaning != null and #arrays.length(item.meaning) > 0}"
                      th:text="${m + (iterStat.last ? '' : ', ')}">eat</span>
                <span th:unless="${item.meaning != null and #arrays.length(item.meaning) > 0}">-</span>
            </td>
            <td>
                <span class="badge bg-info" th:if="${item.posDescription != null}" th:text="${item.posDescription}">动词II段</span>
                <span th:unless="${item.posDescription != null}">-</span>
            </td>
            <td>
                <span th:each="n,iterStat : ${item.notes}"
                      th:if="${item.notes != null and #arrays.length(item.notes) > 0}"
                      th:text="${n + (iterStat.last ? '' : ', ')}">verb</span>
                <span th:unless="${item.notes != null and #arrays.length(item.notes) > 0}">-</span>
            </td>
            <td class="d-flex gap-2">
                <button class="btn btn-outline-primary btn-sm"
                        data-modal="word-modal" th:attr="data-edit-id=${item.id}"
                        th:if="${#sets.contains(userAuthorities, '*') or #sets.contains(userAuthorities, 'dict:word:update')}">Edit
                </button>
            </td>
        </th:block>
    </th:block>

    <!-- Word Modal (Bootstrap 5) -->
    <div aria-hidden="true" class="modal fade" id="word-modal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Create Word</h5>
                    <button aria-label="Close" class="btn-close" data-bs-dismiss="modal" type="button"></button>
                </div>
                <form class="dict-modal-form" data-api-base="/api/words">
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label" for="word-word">Word</label>
                            <input class="form-control" id="word-word" name="word" required type="text">
                            <div class="invalid-feedback" data-field="word"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="word-reading">Reading</label>
                            <input class="form-control" id="word-reading" name="reading" type="text">
                            <div class="invalid-feedback" data-field="reading"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="word-romaji">Romaji</label>
                            <input class="form-control" id="word-romaji" name="romaji" type="text">
                            <div class="invalid-feedback" data-field="romaji"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="word-pos">Part of Speech</label>
                            <select class="form-select" id="word-pos" name="pos">
                                <option value="">-- Select --</option>
                                <option th:each="p : ${allPos}" th:value="${p.name()}" th:text="${p.remark}">名词</option>
                            </select>
                            <div class="invalid-feedback" data-field="pos"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="word-meaning">Meaning (comma separated)</label>
                            <input class="form-control" id="word-meaning" name="meaning" type="text">
                            <div class="invalid-feedback" data-field="meaning"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="word-notes">Notes (comma separated)</label>
                            <input class="form-control" id="word-notes" name="notes" type="text">
                            <div class="invalid-feedback" data-field="notes"></div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button class="btn btn-secondary" data-bs-dismiss="modal" type="button">Cancel</button>
                        <button class="btn btn-primary modal-submit" type="button">Save</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</main>

</body>
</html>
