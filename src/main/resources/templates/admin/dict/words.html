<!DOCTYPE html>
<html layout:decorate="~{admin/layout}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <title>单词管理</title>
</head>

<body>

<main layout:fragment="content">
    <th:block th:replace="~{admin/fragments/data-table :: table(
        title='单词',
        description='管理日汉词典单词',
        createUrl='#',
        createModal='word-modal',
        createPermission='dict:word:create',
        items=${words},
        emptyMessage='未找到单词',
        baseUrl='/admin/dict/words',
        page=${page},
        colspan=8,
        headers=~{::#word-headers},
        rows=~{::#word-row},
        beforeTable=~{::#word-search}
    )}">
        <th:block id="word-search">
            <div class="row g-2 mb-3">
                <div class="col-md-5">
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-search"></i></span>
                        <input class="form-control dict-search-input" id="wordSearchInput"
                               placeholder="搜索单词、读音、罗马音..."
                               th:value="${keyword}" type="text">
                        <button class="btn btn-outline-secondary" id="wordSearchClear" style="display:none"
                                type="button">
                            <i class="bi bi-x-lg"></i>
                        </button>
                    </div>
                </div>
                <div class="col-md-3">
                    <select class="form-select dict-pos-filter" id="wordPosFilter">
                        <option value="">全部词性</option>
                        <option th:each="p : ${allPos}" th:selected="${selectedPos != null and selectedPos == p.name()}"
                                th:text="${p.remark}"
                                th:value="${p.name()}">名词
                        </option>
                    </select>
                </div>
            </div>
        </th:block>
        <th:block id="word-headers">
            <th>ID</th>
            <th>单词</th>
            <th>读音</th>
            <th>罗马音</th>
            <th>含义</th>
            <th>词性</th>
            <th>备注</th>
            <th>操作</th>
        </th:block>
        <th:block id="word-row">
            <td th:text="${item.id}">1</td>
            <td><strong th:text="${item.word}">食べる</strong></td>
            <td th:text="${item.reading}">たべる</td>
            <td th:text="${item.romaji}">taberu</td>
            <td>
                <span th:each="m,iterStat : ${item.meaning}"
                      th:if="${item.meaning != null and #arrays.length(item.meaning) > 0}"
                      th:text="${m + (iterStat.last ? '' : ', ')}">eat</span>
                <span th:unless="${item.meaning != null and #arrays.length(item.meaning) > 0}">-</span>
            </td>
            <td>
                <span class="badge bg-info" th:if="${item.posDescription != null}" th:text="${item.posDescription}">动词II段</span>
                <span th:unless="${item.posDescription != null}">-</span>
            </td>
            <td>
                <span th:each="n,iterStat : ${item.notes}"
                      th:if="${item.notes != null and #arrays.length(item.notes) > 0}"
                      th:text="${n + (iterStat.last ? '' : ', ')}">verb</span>
                <span th:unless="${item.notes != null and #arrays.length(item.notes) > 0}">-</span>
            </td>
            <td class="d-flex gap-2">
                <button class="btn btn-outline-primary btn-sm"
                        data-modal="word-modal" th:attr="data-edit-id=${item.id}"
                        th:if="${#sets.contains(userAuthorities, '*') or #sets.contains(userAuthorities, 'dict:word:update')}">
                    编辑
                </button>
                <button class="btn btn-outline-danger btn-sm"
                        th:attr="data-delete-api='/api/words',data-delete-id=${item.id},data-delete-name=${item.word}"
                        th:if="${#sets.contains(userAuthorities, '*') or #sets.contains(userAuthorities, 'dict:word:delete')}">
                    删除
                </button>
            </td>
        </th:block>
    </th:block>

    <!-- Word Modal (Bootstrap 5) -->
    <div aria-hidden="true" class="modal fade" id="word-modal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">创建单词</h5>
                    <button aria-label="Close" class="btn-close" data-bs-dismiss="modal" type="button"></button>
                </div>
                <form class="dict-modal-form" data-api-base="/api/words">
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label" for="word-word">单词</label>
                            <input class="form-control" id="word-word" name="word" required type="text">
                            <div class="invalid-feedback" data-field="word"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="word-reading">读音</label>
                            <input class="form-control" id="word-reading" name="reading" type="text">
                            <div class="invalid-feedback" data-field="reading"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="word-romaji">罗马音</label>
                            <input class="form-control" id="word-romaji" name="romaji" type="text">
                            <div class="invalid-feedback" data-field="romaji"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="word-pos">词性</label>
                            <select class="form-select" id="word-pos" name="pos">
                                <option value="">-- 请选择 --</option>
                                <option th:each="p : ${allPos}" th:text="${p.remark}" th:value="${p.name()}">名词
                                </option>
                            </select>
                            <div class="invalid-feedback" data-field="pos"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="word-meaning">含义（逗号分隔）</label>
                            <input class="form-control" id="word-meaning" name="meaning" type="text">
                            <div class="invalid-feedback" data-field="meaning"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="word-notes">备注（逗号分隔）</label>
                            <input class="form-control" id="word-notes" name="notes" type="text">
                            <div class="invalid-feedback" data-field="notes"></div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button class="btn btn-secondary" data-bs-dismiss="modal" type="button">取消</button>
                        <button class="btn btn-primary modal-submit" type="button">保存</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script th:inline="javascript">
        (function () {
            var searchInput = document.getElementById('wordSearchInput');
            var posFilter = document.getElementById('wordPosFilter');
            var clearBtn = document.getElementById('wordSearchClear');
            var DEBOUNCE_MS = 400;
            var searchTimer = null;

            function doSearch() {
                var keyword = searchInput ? searchInput.value.trim() : '';
                var pos = posFilter ? posFilter.value : '';
                var params = new URLSearchParams();
                if (keyword) params.set('keyword', keyword);
                if (pos) params.set('pos', pos);
                var url = '/admin/dict/words';
                var qs = params.toString();
                if (qs) url += '?' + qs;
                window.location.href = url;
            }

            function updateClearBtn() {
                if (clearBtn) {
                    clearBtn.style.display = searchInput.value ? '' : 'none';
                }
            }

            if (searchInput) {
                updateClearBtn();
                searchInput.addEventListener('input', function () {
                    updateClearBtn();
                    clearTimeout(searchTimer);
                    searchTimer = setTimeout(doSearch, DEBOUNCE_MS);
                });
                searchInput.addEventListener('keydown', function (e) {
                    if (e.key === 'Enter') {
                        clearTimeout(searchTimer);
                        doSearch();
                    }
                });
            }

            if (clearBtn) {
                clearBtn.addEventListener('click', function () {
                    searchInput.value = '';
                    updateClearBtn();
                    clearTimeout(searchTimer);
                    doSearch();
                });
            }

            if (posFilter) {
                posFilter.addEventListener('change', function () {
                    clearTimeout(searchTimer);
                    doSearch();
                });
            }
        })();
    </script>
</main>

</body>
</html>
