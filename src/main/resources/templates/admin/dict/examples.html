<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/layout}">

<head>
    <title>Examples</title>
</head>

<body>

<main layout:fragment="content">
    <th:block th:replace="~{admin/fragments/data-table :: table(
        title='Examples',
        description='Manage Japanese-Chinese example sentences',
        createUrl='#',
        createModal='example-modal',
        createPermission='dict:example:create',
        items=${examples},
        emptyMessage='No examples found',
        baseUrl='/admin/dict/examples',
        page=${page},
        colspan=4,
        headers=~{::#example-headers},
        rows=~{::#example-row}
    )}">
        <th:block id="example-headers">
            <th>ID</th>
            <th>Japanese</th>
            <th>Chinese</th>
            <th>Actions</th>
        </th:block>
        <th:block id="example-row">
            <td th:text="${item.id}">1</td>
            <td th:text="${item.jp}">私は学生です。</td>
            <td th:text="${item.cn}">我是学生。</td>
            <td class="d-flex gap-2">
                <button th:if="${#sets.contains(userAuthorities, '*') or #sets.contains(userAuthorities, 'dict:example:update')}"
                        data-modal="example-modal" th:attr="data-edit-id=${item.id}" class="btn btn-outline-primary btn-sm">Edit</button>
            </td>
        </th:block>
    </th:block>

    <!-- Example Modal (Bootstrap 5) -->
    <div class="modal fade" id="example-modal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Create Example</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form class="dict-modal-form" data-api-base="/api/examples">
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label" for="example-jp">Japanese</label>
                            <input type="text" id="example-jp" name="jp" class="form-control" required>
                            <div class="invalid-feedback" data-field="jp"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="example-cn">Chinese</label>
                            <input type="text" id="example-cn" name="cn" class="form-control" required>
                            <div class="invalid-feedback" data-field="cn"></div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="button" class="btn btn-primary modal-submit">Save</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</main>

</body>
</html>
