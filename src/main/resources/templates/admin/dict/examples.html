<!DOCTYPE html>
<html layout:decorate="~{admin/layout}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <title>例句管理</title>
</head>

<body>

<main layout:fragment="content">
    <th:block th:replace="~{admin/fragments/data-table :: table(
        title='例句',
        description='管理日汉例句',
        createUrl='#',
        createModal='example-modal',
        createPermission='dict:examples:create',
        items=${examples},
        emptyMessage='未找到例句',
        baseUrl='/admin/dict/examples',
        page=${page},
        colspan=6,
        headers=~{::#example-headers},
        rows=~{::#example-row},
        filter=~{::#example-filter}
    )}">
        <th:block id="example-filter">
            <div class="row g-2" data-table-search="/admin/dict/examples">
                <div class="col-md-5">
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-search"></i></span>
                        <input class="form-control dict-search-input" data-search-field="keyword"
                               placeholder="搜索日语例句、中文翻译..."
                               th:value="${keyword}" type="text">
                        <button class="btn btn-outline-secondary" data-search-clear style="display:none"
                                type="button">
                            <i class="bi bi-x-lg"></i>
                        </button>
                        <button class="btn btn-primary" data-search-submit type="button">
                            <i class="bi bi-search me-1"></i>搜索
                        </button>
                    </div>
                </div>
                <div class="col-md-3">
                    <button class="btn btn-outline-warning w-100" id="regen-all-example-audio-btn" type="button">
                        <i class="bi bi-arrow-repeat"></i> 全部重新生成音频
                    </button>
                </div>
            </div>
        </th:block>
        <th:block id="example-headers">
            <th>日语</th>
            <th>中文</th>
            <th style="min-width:160px">关联单词</th>
            <th style="min-width:140px">关联语法</th>
            <th>音频</th>
            <th>操作</th>
        </th:block>
        <th:block id="example-row">
            <td th:text="${item.jp}">私は学生です。</td>
            <td th:text="${item.cn}">我是学生。</td>
            <td>
                <span class="d-flex flex-wrap gap-1"
                      th:if="${item.relatedWordItems != null and !item.relatedWordItems.isEmpty()}">
                    <button class="badge bg-primary text-decoration-none word-detail-btn"
                            style="font-size:.78rem; cursor:pointer; border:none;"
                            th:each="w : ${item.relatedWordItems}"
                            th:data-id="${w.id}"
                            th:text="${w.word + (w.reading != null ? '（' + w.reading + '）' : '')}">食べる（たべる）</button>
                </span>
                <span class="text-muted"
                      th:unless="${item.relatedWordItems != null and !item.relatedWordItems.isEmpty()}">-</span>
            </td>
            <td>
                <span class="d-flex flex-wrap gap-1"
                      th:if="${item.relatedGrammarItems != null and !item.relatedGrammarItems.isEmpty()}">
                    <button class="badge bg-info text-decoration-none grammar-detail-btn"
                            style="font-size:.78rem; cursor:pointer; border:none; color:#212529;"
                            th:each="g : ${item.relatedGrammarItems}"
                            th:data-id="${g.id}"
                            th:text="${g.pattern + (g.reading != null ? '（' + g.reading + '）' : '')}">〜たい（〜たい）</button>
                </span>
                <span class="text-muted"
                      th:unless="${item.relatedGrammarItems != null and !item.relatedGrammarItems.isEmpty()}">-</span>
            </td>
            <td>
                <button class="btn btn-outline-info btn-sm play-audio-btn"
                        th:if="${item.audioUrl != null and !item.audioUrl.isEmpty()}"
                        th:data-audio="${item.audioUrl}"
                        title="播放音频">
                    <i class="bi bi-play-fill"></i>
                </button>
                <button class="btn btn-outline-secondary btn-sm regen-audio-btn"
                        th:if="${item.audioUrl != null and !item.audioUrl.isEmpty()}"
                        th:data-id="${item.id}"
                        title="重新生成">
                    <i class="bi bi-arrow-repeat"></i>
                </button>
                <button class="btn btn-outline-primary btn-sm regen-audio-btn"
                        th:unless="${item.audioUrl != null and !item.audioUrl.isEmpty()}"
                        th:data-id="${item.id}"
                        title="生成音频">
                    <i class="bi bi-volume-up"></i>
                </button>
            </td>
            <td class="d-flex gap-2">
                <button class="btn btn-outline-primary btn-sm"
                        data-modal="example-modal" th:attr="data-edit-id=${item.id}"
                        th:if="${#sets.contains(userAuthorities, '*') or #sets.contains(userAuthorities, 'dict:examples:update')}">
                    编辑
                </button>
                <button class="btn btn-outline-danger btn-sm"
                        data-delete-api="/api/examples" th:attr="data-delete-id=${item.id}"
                        th:if="${#sets.contains(userAuthorities, '*') or #sets.contains(userAuthorities, 'dict:examples:delete')}">
                    删除
                </button>
            </td>
        </th:block>
    </th:block>

    <!-- Example Modal (Bootstrap 5) -->
    <div aria-hidden="true" class="modal fade" id="example-modal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">创建例句</h5>
                    <button aria-label="Close" class="btn-close" data-bs-dismiss="modal" type="button"></button>
                </div>
                <form class="dict-modal-form" data-api-base="/api/examples">
                    <!-- Hidden fields for tag selector IDs -->
                    <input name="relatedWords" type="hidden" value="">
                    <input name="relatedGrammars" type="hidden" value="">
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label" for="example-jp">日语</label>
                            <div class="d-flex gap-2">
                                <input class="form-control" id="example-jp" name="jp" required type="text">
                                <button class="btn btn-outline-primary ai-analyze-btn" type="button">
                                    <span class="ai-btn-icon"><i class="bi bi-robot"></i></span>
                                    <span class="ai-btn-text">AI分析</span>
                                </button>
                            </div>
                            <div class="example-exists-warning" style="display:none"></div>
                            <div class="invalid-feedback" data-field="jp"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="example-cn">中文</label>
                            <input class="form-control" id="example-cn" name="cn" required type="text">
                            <div class="invalid-feedback" data-field="cn"></div>
                        </div>

                        <!-- Related Words Tag Selector -->
                        <div class="mb-3">
                            <label class="form-label">关联单词</label>
                            <div class="tag-selector"
                                 data-field="relatedWords"
                                 data-placeholder="输入关键词搜索单词..."
                                 data-search-url="/api/words/search?keyword=">
                                <div class="tag-list d-flex flex-wrap gap-1 mb-2"></div>
                                <div class="tag-input-wrap">
                                    <input autocomplete="off" class="tag-input" placeholder="" type="text">
                                    <div class="tag-dropdown"></div>
                                </div>
                            </div>
                            <div class="invalid-feedback" data-field="relatedWords"></div>
                        </div>

                        <!-- Related Grammars Tag Selector -->
                        <div class="mb-3">
                            <label class="form-label">关联语法</label>
                            <div class="tag-selector"
                                 data-field="relatedGrammars"
                                 data-placeholder="输入关键词搜索语法..."
                                 data-search-url="/api/grammars/search?keyword=">
                                <div class="tag-list d-flex flex-wrap gap-1 mb-2"></div>
                                <div class="tag-input-wrap">
                                    <input autocomplete="off" class="tag-input" placeholder="" type="text">
                                    <div class="tag-dropdown"></div>
                                </div>
                            </div>
                            <div class="invalid-feedback" data-field="relatedGrammars"></div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button class="btn btn-secondary" data-bs-dismiss="modal" type="button">取消</button>
                        <button class="btn btn-primary modal-submit" type="button">保存</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Tag Selector Styles & Script (must stay inside layout:fragment) -->
    <!-- Detail Card Container -->
    <div class="detail-card-overlay" id="detailCardOverlay"></div>
    <div class="detail-card" id="detailCard">
        <div class="detail-card-header">
            <span>
                <span class="detail-title" id="detailTitle"></span>
                <span class="detail-reading" id="detailReading"></span>
            </span>
            <span class="detail-close" id="detailClose">&times;</span>
        </div>
        <div class="detail-card-body" id="detailBody"></div>
    </div>

    <style>
        /* Container */
        .tag-selector {
            border: 1px solid #ced4da;
            border-radius: 0.375rem;
            padding: 0.4rem;
            background-color: #fff;
            transition: border-color 0.15s ease-in-out, box-shadow 0.15s ease-in-out;
            cursor: text;
        }

        .tag-selector:focus-within {
            border-color: #86b7fe;
            box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.15);
        }

        /* Tag badges */
        .tag-item {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            padding: 0.2rem 0.55rem;
            font-size: 0.8rem;
            color: #fff;
            border-radius: 0.25rem;
            user-select: none;
            animation: tagIn 0.12s ease-out;
        }

        .tag-item[data-field="relatedWords"] {
            background-color: #0d6efd;
        }

        .tag-item[data-field="relatedGrammars"] {
            background-color: #0dcaf0;
            color: #212529;
        }

        .tag-item .tag-remove {
            cursor: pointer;
            opacity: 0.75;
            font-size: 0.85em;
            line-height: 1;
            transition: opacity 0.15s;
        }

        .tag-item .tag-remove:hover {
            opacity: 1;
        }

        /* Input area */
        .tag-input-wrap {
            position: relative;
        }

        .tag-input {
            display: block;
            width: 100%;
            border: none !important;
            outline: none !important;
            box-shadow: none !important;
            padding: 0.15rem 0 !important;
            margin: 0 !important;
            min-width: 120px;
            font-size: 0.9rem;
            line-height: 1.5;
            background: transparent;
        }

        /* Dropdown */
        .tag-dropdown {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            z-index: 1060;
            max-height: 220px;
            overflow-y: auto;
            margin-top: 2px;
            background-color: #fff;
            border: 1px solid rgba(0, 0, 0, .15);
            border-radius: 0.375rem;
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, .175);
        }

        .tag-dropdown.show {
            display: block;
        }

        .tag-dropdown-item {
            display: block;
            width: 100%;
            padding: 0.45rem 0.85rem;
            font-size: 0.87rem;
            color: #212529;
            cursor: pointer;
            transition: background-color 0.1s;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .tag-dropdown-item:hover,
        .tag-dropdown-item.active {
            background-color: #e9ecef;
        }

        .tag-dropdown-item strong {
            font-weight: 600;
        }

        .tag-dropdown-item .dd-sub {
            font-size: 0.78rem;
            color: #6c757d;
            margin-left: 0.4rem;
        }

        .tag-dropdown-empty {
            padding: 0.55rem 0.85rem;
            font-size: 0.82rem;
            color: #6c757d;
        }

        /* AI Analyze Button */
        .ai-analyze-btn {
            white-space: nowrap;
            padding-left: 0.75rem;
            padding-right: 0.75rem;
        }
        .ai-analyze-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .ai-analyze-btn.loading .ai-btn-icon {
            animation: spin 1s linear infinite;
        }
        .ai-analyze-btn.loading .ai-btn-text {
            opacity: 0.7;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Exists warning */
        .example-exists-warning {
            margin-top: 0.3rem;
            font-size: 0.82rem;
            color: #dc3545;
            display: flex;
            align-items: center;
            gap: 0.3rem;
            animation: fadeIn 0.2s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-4px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes tagIn {
            from {
                transform: scale(0.9);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* Detail Card Styles */
        .detail-card-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 9998;
            background-color: rgba(0, 0, 0, 0);
            display: none;
        }

        .detail-card-overlay.active {
            display: block;
        }

        .detail-card {
            position: fixed;
            z-index: 9999;
            background: #fff;
            border-radius: 0.5rem;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15), 0 0 0 1px rgba(0, 0, 0, 0.06);
            padding: 0;
            min-width: 280px;
            max-width: 420px;
            max-height: 70vh;
            overflow-y: auto;
            display: none;
            animation: cardIn 0.2s ease-out;
            border: 1px solid #e9ecef;
        }

        .detail-card.active {
            display: block;
        }

        .detail-card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.75rem 1rem;
            border-bottom: 1px solid #e9ecef;
            background-color: #f8f9fa;
            border-radius: 0.5rem 0.5rem 0 0;
        }

        .detail-card-header .detail-title {
            font-weight: 600;
            font-size: 0.95rem;
            color: #212529;
        }

        .detail-card-header .detail-reading {
            font-size: 0.85rem;
            color: #6c757d;
            margin-left: 0.5rem;
        }

        .detail-card-header .detail-close {
            cursor: pointer;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: background-color 0.15s;
            font-size: 0.85rem;
            color: #6c757d;
        }

        .detail-card-header .detail-close:hover {
            background-color: #e9ecef;
            color: #212529;
        }

        .detail-card-body {
            padding: 0.85rem 1rem;
        }

        .detail-item {
            margin-bottom: 0.6rem;
        }

        .detail-item:last-child {
            margin-bottom: 0;
        }

        .detail-label {
            font-size: 0.75rem;
            font-weight: 500;
            color: #6c757d;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.25rem;
            display: block;
        }

        .detail-value {
            font-size: 0.87rem;
            color: #212529;
            line-height: 1.5;
        }

        .detail-value .meaning-item {
            display: block;
            padding: 0.15rem 0;
            position: relative;
            padding-left: 0.75rem;
        }

        .detail-value .meaning-item::before {
            content: '•';
            position: absolute;
            left: 0;
            color: #0d6efd;
            font-size: 0.65rem;
        }

        .detail-value .note-item {
            display: block;
            padding: 0.15rem 0;
            font-size: 0.82rem;
            color: #6c757d;
            font-style: italic;
        }

        .detail-card.word-card .detail-card-header {
            border-top: 3px solid #0d6efd;
        }

        .detail-card.word-card .detail-label.pos-label {
            color: #0d6efd;
        }

        .detail-card.grammar-card .detail-card-header {
            border-top: 3px solid #0dcaf0;
        }

        .detail-card.grammar-card .detail-label.pattern-label {
            color: #0dcaf0;
        }

        @keyframes cardIn {
            from {
                opacity: 0;
                transform: translateY(-8px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Badge hover effect */
        .word-detail-btn:hover,
        .grammar-detail-btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        }

        .word-detail-btn:active,
        .grammar-detail-btn:active {
            transform: translateY(0);
        }
    </style>

    <script th:inline="javascript">
        // Global utility function - used by multiple script blocks
        window._esc = function (str) {
            if (!str) return '';
            var d = document.createElement('div');
            d.textContent = str;
            return d.innerHTML;
        };
    </script>

    <script th:inline="javascript">
        (function () {
            var DEBOUNCE_MS = 300;

            // ── Init on modal open ──
            document.addEventListener('shown.bs.modal', function (e) {
                if (e.target.id !== 'example-modal') return;
                initTagSelectors();
            });
            document.addEventListener('DOMContentLoaded', initTagSelectors);
            window.initTagSelectors = initTagSelectors;

            function initTagSelectors() {
                var selectors = document.querySelectorAll('#example-modal .tag-selector');
                for (var s = 0; s < selectors.length; s++) {
                    initOne(selectors[s]);
                }
            }

            function initOne(container) {
                if (container._inited) return;
                container._inited = true;

                var field = container.dataset.field;
                var searchUrl = container.dataset.searchUrl;
                var listEl = container.querySelector('.tag-list');
                var input = container.querySelector('.tag-input');
                var dropdown = container.querySelector('.tag-dropdown');
                var hiddenInput = document.querySelector('form.dict-modal-form input[name="' + field + '"]');

                var selected = {};
                var activeIndex = -1;
                var abortController = null;

                input.placeholder = container.dataset.placeholder || '';

                // ── Events ──
                input.addEventListener('focus', function () {
                    container.classList.add('focused');
                });
                input.addEventListener('blur', function () {
                    setTimeout(hideDropdown, 150);
                    container.classList.remove('focused');
                });
                input.addEventListener('keydown', handleKeydown);
                input.addEventListener('input', function () {
                    activeIndex = -1;
                    var q = this.value.trim();
                    if (!q) {
                        hideDropdown();
                        return;
                    }
                    debounceSearch(q);
                });

                // ── Search ──
                function debounceSearch(query) {
                    if (abortController) abortController.abort();
                    var ac = new AbortController();
                    abortController = ac;
                    setTimeout(function () {
                        doSearch(query, ac);
                    }, DEBOUNCE_MS);
                }

                async function doSearch(query, controller) {
                    try {
                        var resp = await fetch(searchUrl + encodeURIComponent(query), {signal: controller.signal});
                        var items = await resp.json();
                        // Unwrap ApiResult wrapper
                        if (items && typeof items === 'object' && !Array.isArray(items) && items.data) {
                            items = items.data;
                        }
                        if (!Array.isArray(items) || items.length === 0) {
                            dropdown.innerHTML = '<div class="tag-dropdown-empty">未找到结果</div>';
                            showDropdown();
                            return;
                        }
                        var filtered = [];
                        for (var f = 0; f < items.length; f++) {
                            if (!selected[items[f].id]) filtered.push(items[f]);
                        }
                        if (filtered.length === 0) {
                            dropdown.innerHTML = '<div class="tag-dropdown-empty">所有匹配项已选中</div>';
                            showDropdown();
                            return;
                        }
                        renderDropdown(filtered);
                    } catch (e) {
                        if (e.name !== 'AbortError') console.warn('Tag search error:', e);
                    }
                }

                function renderDropdown(items) {
                    dropdown.innerHTML = '';
                    for (var i = 0; i < items.length; i++) {
                        (function (it, idx) {
                            var el = document.createElement('div');
                            el.className = 'tag-dropdown-item';
                            el.innerHTML = '<strong>' + _esc(it.word || '') + '</strong>'
                                + '<span class="dd-sub">' + _esc(it.reading || '') + '</span>';
                            el.onmousedown = function (ev) {
                                ev.preventDefault();
                                selectItem(it);
                            };
                            el.onmouseenter = function () {
                                setActive(idx);
                            };
                            dropdown.appendChild(el);
                        })(items[i], i);
                    }
                    showDropdown();
                }

                function setActive(idx) {
                    activeIndex = idx;
                    var els = dropdown.querySelectorAll('.tag-dropdown-item');
                    for (var e = 0; e < els.length; e++) {
                        els[e].classList.toggle('active', e === idx);
                    }
                }

                // ── Keyboard ──
                function handleKeydown(ev) {
                    var items = dropdown.querySelectorAll('.tag-dropdown-item');
                    if (ev.key === 'ArrowDown') {
                        ev.preventDefault();
                        if (items.length > 0) activeIndex = Math.min(activeIndex + 1, items.length - 1);
                        else activeIndex = 0;
                        setActive(activeIndex);
                        scrollToActive(items);
                    } else if (ev.key === 'ArrowUp') {
                        ev.preventDefault();
                        activeIndex = Math.max(activeIndex - 1, 0);
                        setActive(activeIndex);
                        scrollToActive(items);
                    } else if (ev.key === 'Enter') {
                        ev.preventDefault();
                        if (activeIndex >= 0 && activeIndex < items.length) {
                            items[activeIndex].click();
                        } else if (input.value.trim()) {
                            debounceSearch(input.value.trim());
                        }
                    } else if (ev.key === 'Escape') {
                        hideDropdown();
                        input.blur();
                    } else if (ev.key === 'Backspace' && !input.value && Object.keys(selected).length > 0) {
                        var ids = Object.keys(selected);
                        removeItem(ids[ids.length - 1]);
                    }
                }

                function scrollToActive(items) {
                    if (items[activeIndex]) items[activeIndex].scrollIntoView({block: 'nearest'});
                }

                // ── Select / Remove ──
                function selectItem(item) {
                    selected[item.id] = item;
                    addBadge(item);
                    syncHidden();
                    input.value = '';
                    hideDropdown();
                    input.focus();
                }

                function removeItem(id) {
                    delete selected[id];
                    var badge = listEl.querySelector('.tag-badge[data-id="' + id + '"]');
                    if (badge) badge.remove();
                    syncHidden();
                }

                function addBadge(item) {
                    var badge = document.createElement('span');
                    badge.className = 'tag-item tag-badge';
                    badge.dataset.id = item.id;
                    badge.setAttribute('data-field', field);
                    badge.innerHTML = _esc(item.word)
                        + (item.reading ? ' <small>(' + _esc(item.reading) + ')</small>' : '')
                        + ' <span class="tag-remove">&times;</span>';
                    badge.querySelector('.tag-remove').onclick = function () {
                        removeItem(item.id);
                    };
                    listEl.appendChild(badge);
                }

                function syncHidden() {
                    hiddenInput.value = Object.keys(selected).join(',');
                }

                function showDropdown() {
                    dropdown.classList.add('show');
                }

                function hideDropdown() {
                    dropdown.classList.remove('show');
                    activeIndex = -1;
                }

                // ── Public API ──
                container.setTagData = function (items) {
                    clearAll();
                    if (!Array.isArray(items)) return;
                    for (var i = 0; i < items.length; i++) selectItem(items[i]);
                };
                container.getTagIds = function () {
                    var keys = Object.keys(selected);
                    var arr = [];
                    for (var i = 0; i < keys.length; i++) arr.push(Number(keys[i]));
                    return arr;
                };
                container.clearTags = clearAll;

                function clearAll() {
                    selected = {};
                    listEl.innerHTML = '';
                    syncHidden();
                }
            }

            // ── AI Analyze ──
            var aiBtn = document.querySelector('#example-modal .ai-analyze-btn');
            var aiAbort = null;

            if (aiBtn) {
                aiBtn.addEventListener('click', function () {
                    var jp = jpInput ? jpInput.value.trim() : '';
                    if (!jp) {
                        jpInput.focus();
                        jpInput.classList.add('is-invalid');
                        return;
                    }
                    doAiAnalyze(jp);
                });
            }

            async function doAiAnalyze(jp) {
                if (aiAbort) aiAbort.abort();
                var ac = new AbortController();
                aiAbort = ac;

                // Show loading state
                aiBtn.classList.add('loading');
                aiBtn.disabled = true;

                try {
                    var resp = await fetch('/api/examples/ai-analyze', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ jp: jp }),
                        signal: ac.signal
                    });

                    var result = await resp.json();
                    // Unwrap ApiResult wrapper
                    if (result && typeof result === 'object' && !Array.isArray(result) && result.data) {
                        result = result.data;
                    }

                    if (!result.success) {
                        showToast('AI分析失败: ' + (result.error || '未知错误'), 'error');
                        return;
                    }

                    // Fill CN translation
                    var cnInput = document.getElementById('example-cn');
                    if (cnInput && result.cn) {
                        cnInput.value = result.cn;
                    }

                    // Fill related words
                    var wordSelector = document.querySelector('#example-modal .tag-selector[data-field="relatedWords"]');
                    if (wordSelector && result.words && result.words.length > 0) {
                        // Convert to format expected by tag selector
                        var wordItems = result.words.map(function (w) {
                            return {
                                id: w.id,
                                word: w.word,
                                reading: w.reading
                            };
                        });
                        if (wordSelector.setTagData) {
                            wordSelector.setTagData(wordItems);
                        }
                    }

                    // Fill related grammars
                    var grammarSelector = document.querySelector('#example-modal .tag-selector[data-field="relatedGrammars"]');
                    if (grammarSelector && result.grammars && result.grammars.length > 0) {
                        // Convert to format expected by tag selector
                        var grammarItems = result.grammars.map(function (g) {
                            return {
                                id: g.id,
                                word: g.pattern,  // tag selector uses 'word' property
                                reading: g.reading
                            };
                        });
                        if (grammarSelector.setTagData) {
                            grammarSelector.setTagData(grammarItems);
                        }
                    }

                    showToast('AI分析完成！', 'success');

                } catch (e) {
                    if (e.name !== 'AbortError') {
                        console.error('AI analyze error:', e);
                        showToast('AI分析失败: ' + e.message, 'error');
                    }
                } finally {
                    aiBtn.classList.remove('loading');
                    aiBtn.disabled = false;
                }
            }

            // ── Existence Check ──
            var existsCheckTimer = null;
            var existsCheckAbort = null;
            var jpInput = document.getElementById('example-jp');
            var existsWarning = document.querySelector('#example-modal .example-exists-warning');

            if (jpInput) {
                jpInput.addEventListener('input', function () {
                    clearTimeout(existsCheckTimer);
                    if (existsCheckAbort) existsCheckAbort.abort();
                    existsWarning.style.display = 'none';
                    existsWarning.textContent = '';

                    var jp = this.value.trim();
                    if (!jp) return;

                    existsCheckTimer = setTimeout(function () {
                        checkExampleExists(jp);
                    }, DEBOUNCE_MS);
                });

                // When modal opens for editing, clear warning
                document.addEventListener('shown.bs.modal', function (e) {
                    if (e.target.id !== 'example-modal') return;
                    existsWarning.style.display = 'none';
                    existsWarning.textContent = '';
                });
            }

            function checkExampleExists(jp) {
                var form = document.querySelector('#example-modal .dict-modal-form');
                var editId = form ? form.getAttribute('data-edit-id') : null;
                var url = '/api/examples/exists?jp=' + encodeURIComponent(jp);
                if (editId) url += '&excludeId=' + editId;

                if (existsCheckAbort) existsCheckAbort.abort();
                var ac = new AbortController();
                existsCheckAbort = ac;

                fetch(url, {signal: ac.signal})
                    .then(function (resp) {
                        if (!resp.ok) throw new Error('HTTP ' + resp.status);
                        return resp.json();
                    })
                    .then(function (data) {
                        if (data && data.exists) {
                            existsWarning.textContent = '\u26A0 该例句已存在（ID：' + (data.existingId || '?') + '）';
                            existsWarning.style.display = 'flex';
                        } else {
                            existsWarning.style.display = 'none';
                            existsWarning.textContent = '';
                        }
                    })
                    .catch(function (e) {
                        if (e.name !== 'AbortError') console.warn('Existence check error:', e);
                    });
            }

                    })();
    </script>

    <script th:inline="javascript">
        (function () {
            // ── Utility ──
            // Use global _esc function, fallback to local if not available
            var esc = window._esc || function (str) {
                if (!str) return '';
                var d = document.createElement('div');
                d.textContent = str;
                return d.innerHTML;
            };

            // ── Word POS Mapping ──
            var posMapping = {
                'ADJ_I': 'い形容词',
                'ADJ_NA': 'ナ形容词',
                'ADV': '副词',
                'AUX': '助动词',
                'CONJ': '接续词',
                'COUNTER': '量词',
                'GRAMMAR': '语法',
                'GREET': '寒暄语',
                'INTERJ': '感叹词',
                'NOUN': '名词',
                'NUM': '数词',
                'PART': '助词',
                'PHRASE': '惯用句、词组',
                'PREFIX': '接头词',
                'PRENOM': '连体词',
                'PRON': '代词',
                'SENTENCE': '句子',
                'SUFFIX': '接尾词',
                'UNKNOWN': '未知',
                'VERB_I': '动词-I类',
                'VERB_II': '动词-II类',
                'VERB_III': '动词-III类',
                'VERB_TRANS': '动词-自他两用'
            };

            function getPosLabel(pos) {
                return posMapping[pos] || pos || '';
            }

            // ── Detail Card Logic ──
            var detailCard = document.getElementById('detailCard');
            var detailOverlay = document.getElementById('detailCardOverlay');
            var detailTitle = document.getElementById('detailTitle');
            var detailReading = document.getElementById('detailReading');
            var detailBody = document.getElementById('detailBody');
            var detailClose = document.getElementById('detailClose');

            var currentBtn = null;

            // ── Word Detail Buttons ──
            document.addEventListener('click', function (e) {
                var btn = e.target.closest('.word-detail-btn');
                if (btn) {
                    e.preventDefault();
                    toggleWordDetail(btn);
                    return;
                }

                var grammarBtn = e.target.closest('.grammar-detail-btn');
                if (grammarBtn) {
                    e.preventDefault();
                    toggleGrammarDetail(grammarBtn);
                    return;
                }

                // Close if clicking outside
                if (!detailCard.contains(e.target) && !e.target.closest('.word-detail-btn') && !e.target.closest('.grammar-detail-btn')) {
                    closeDetail();
                }
            });

            // Close button
            if (detailClose) {
                detailClose.addEventListener('click', closeDetail);
            }

            // Escape key
            document.addEventListener('keydown', function (e) {
                if (e.key === 'Escape') {
                    closeDetail();
                }
            });

            function toggleWordDetail(btn) {
                if (currentBtn === btn && detailCard.classList.contains('active')) {
                    closeDetail();
                    return;
                }

                var wordId = btn.dataset.id;
                if (!wordId) return;

                // Show loading state
                detailTitle.textContent = '加载中...';
                detailReading.textContent = '';
                detailBody.innerHTML = '<div class="detail-value" style="color:#6c757d;">正在获取详情...</div>';
                detailCard.className = 'detail-card word-card';
                showCard(btn);
                currentBtn = btn;

                // Fetch word detail from API
                fetch('/api/words/' + wordId)
                    .then(function (resp) {
                        if (!resp.ok) throw new Error('HTTP ' + resp.status);
                        return resp.json();
                    })
                    .then(function (data) {
                        // Unwrap ApiResult wrapper
                        if (data && typeof data === 'object' && !Array.isArray(data) && data.data) {
                            data = data.data;
                        }
                        renderWordDetail(data);
                    })
                    .catch(function (e) {
                        console.error('Fetch word detail error:', e);
                        detailBody.innerHTML = '<div class="detail-value" style="color:#dc3545;">加载失败: ' + e.message + '</div>';
                    });
            }

            function renderWordDetail(data) {
                if (!data) {
                    detailBody.innerHTML = '<div class="detail-value" style="color:#6c757d;">暂无详细信息</div>';
                    return;
                }

                var word = data.word || '';
                var reading = data.reading || '';
                var pos = data.pos || '';
                var romaji = data.romaji || '';
                var meanings = Array.isArray(data.meaning) ? data.meaning.filter(function(m) { return m && m.trim(); }) : [];

                // Build body HTML
                var bodyHtml = '';

                // Part of speech
                if (pos) {
                    bodyHtml += '<div class="detail-item">' +
                        '<span class="detail-label pos-label">词性</span>' +
                        '<span class="detail-value">' + esc(getPosLabel(pos)) + '</span>' +
                        '</div>';
                }

                // Romaji
                if (romaji) {
                    bodyHtml += '<div class="detail-item">' +
                        '<span class="detail-label">罗马音</span>' +
                        '<span class="detail-value">' + esc(romaji) + '</span>' +
                        '</div>';
                }

                // Meanings
                if (meanings.length > 0) {
                    bodyHtml += '<div class="detail-item">' +
                        '<span class="detail-label">含义</span>' +
                        '<span class="detail-value">';
                    for (var i = 0; i < meanings.length; i++) {
                        bodyHtml += '<span class="meaning-item">' + esc(meanings[i]) + '</span>';
                    }
                    bodyHtml += '</span></div>';
                }

                // Set content
                detailTitle.textContent = word;
                detailReading.textContent = reading ? '（' + reading + '）' : '';
                detailBody.innerHTML = bodyHtml || '<div class="detail-value" style="color:#6c757d;">暂无详细信息</div>';
            }

            function toggleGrammarDetail(btn) {
                if (currentBtn === btn && detailCard.classList.contains('active')) {
                    closeDetail();
                    return;
                }

                var grammarId = btn.dataset.id;
                if (!grammarId) return;

                // Show loading state
                detailTitle.textContent = '加载中...';
                detailReading.textContent = '';
                detailBody.innerHTML = '<div class="detail-value" style="color:#6c757d;">正在获取详情...</div>';
                detailCard.className = 'detail-card grammar-card';
                showCard(btn);
                currentBtn = btn;

                // Fetch grammar detail from API
                fetch('/api/grammars/' + grammarId)
                    .then(function (resp) {
                        if (!resp.ok) throw new Error('HTTP ' + resp.status);
                        return resp.json();
                    })
                    .then(function (data) {
                        // Unwrap ApiResult wrapper
                        if (data && typeof data === 'object' && !Array.isArray(data) && data.data) {
                            data = data.data;
                        }
                        renderGrammarDetail(data);
                    })
                    .catch(function (e) {
                        console.error('Fetch grammar detail error:', e);
                        detailBody.innerHTML = '<div class="detail-value" style="color:#dc3545;">加载失败: ' + e.message + '</div>';
                    });
            }

            function renderGrammarDetail(data) {
                if (!data) {
                    detailBody.innerHTML = '<div class="detail-value" style="color:#6c757d;">暂无详细信息</div>';
                    return;
                }

                var pattern = data.pattern || '';
                var reading = data.reading || '';
                var meanings = Array.isArray(data.meaning) ? data.meaning.filter(function(m) { return m && m.trim(); }) : [];

                // Build body HTML
                var bodyHtml = '';

                // Pattern (for grammar, show as label)
                bodyHtml += '<div class="detail-item">' +
                    '<span class="detail-label pattern-label">语法模式</span>' +
                    '<span class="detail-value">' + esc(pattern) + '</span>' +
                    '</div>';

                // Meanings
                if (meanings.length > 0) {
                    bodyHtml += '<div class="detail-item">' +
                        '<span class="detail-label">含义</span>' +
                        '<span class="detail-value">';
                    for (var i = 0; i < meanings.length; i++) {
                        bodyHtml += '<span class="meaning-item">' + esc(meanings[i]) + '</span>';
                    }
                    bodyHtml += '</span></div>';
                }

                // Set content
                detailTitle.textContent = pattern;
                detailReading.textContent = reading ? '（' + reading + '）' : '';
                detailBody.innerHTML = bodyHtml || '<div class="detail-value" style="color:#6c757d;">暂无详细信息</div>';
            }

            function showCard(btn) {
                var rect = btn.getBoundingClientRect();
                var cardWidth = Math.min(360, window.innerWidth - 40);
                var cardHeight = detailCard.offsetHeight;

                // Calculate position - show below the button
                var top = rect.bottom + 8;
                var left = rect.left;

                // Adjust if card would go off screen
                if (left + cardWidth > window.innerWidth - 10) {
                    left = window.innerWidth - cardWidth - 10;
                }
                if (top + cardHeight > window.innerHeight - 10) {
                    top = rect.top - cardHeight - 8;
                }

                detailCard.style.width = cardWidth + 'px';
                detailCard.style.top = top + 'px';
                detailCard.style.left = left + 'px';

                detailCard.classList.add('active');
                detailOverlay.classList.add('active');
            }

            function closeDetail() {
                detailCard.classList.remove('active');
                detailOverlay.classList.remove('active');
                currentBtn = null;
            }
        })();
    </script>

    <script th:inline="javascript">
        (function () {
            var currentAudio = null;

            function playAudio(url) {
                if (currentAudio) {
                    currentAudio.pause();
                    currentAudio = null;
                }
                var audio = new Audio(url);
                currentAudio = audio;
                audio.play().catch(function (e) {
                    console.error('Audio play failed:', e);
                });
            }

            document.addEventListener('click', function (e) {
                var playBtn = e.target.closest('.play-audio-btn');
                if (playBtn) {
                    e.preventDefault();
                    var url = playBtn.dataset.audio;
                    if (url) playAudio(url);
                    return;
                }

                var regenBtn = e.target.closest('.regen-audio-btn');
                if (regenBtn) {
                    e.preventDefault();
                    var id = regenBtn.dataset.id;
                    if (id) {
                        regenBtn.disabled = true;
                        regenBtn.innerHTML = '<i class="bi bi-arrow-repeat spin"></i>';
                        fetch('/api/examples/' + id + '/regenerate-audio', {method: 'POST'})
                            .then(function (r) { return r.json(); })
                            .then(function (d) {
                                if (d && d.data && d.data.success) {
                                    location.reload();
                                } else {
                                    showToast('音频生成失败', 'error');
                                    regenBtn.disabled = false;
                                    regenBtn.innerHTML = '<i class="bi bi-arrow-repeat"></i>';
                                }
                            })
                            .catch(function () {
                                showToast('音频生成失败', 'error');
                                regenBtn.disabled = false;
                                regenBtn.innerHTML = '<i class="bi bi-arrow-repeat"></i>';
                            });
                    }
                    return;
                }
            });

            var regenAllBtn = document.getElementById('regen-all-example-audio-btn');
            if (regenAllBtn) {
                regenAllBtn.addEventListener('click', async function () {
                    var ok = await showConfirm({
                        message: '确定要为所有例句重新生成音频吗？',
                        type: 'warning',
                        title: '批量生成音频',
                        okText: '确定生成'
                    });
                    if (!ok) return;
                    regenAllBtn.disabled = true;
                    var origHtml = regenAllBtn.innerHTML;
                    regenAllBtn.innerHTML = '<i class="bi bi-arrow-repeat spin"></i> 创建任务中...';
                    fetch('/api/examples/regenerate-all-audio', {method: 'POST'})
                        .then(function (r) { return r.json(); })
                        .then(function (d) {
                            var task = d && d.data;
                            if (task && task.id) {
                                showToast('音频生成任务已创建 (ID: ' + task.id + ')，正在跳转...', 'success');
                                setTimeout(function () {
                                    window.location.href = '/admin/task/batch';
                                }, 1200);
                            } else {
                                showToast('任务创建失败', 'error');
                                regenAllBtn.disabled = false;
                                regenAllBtn.innerHTML = origHtml;
                            }
                        })
                        .catch(function () {
                            showToast('任务创建失败', 'error');
                            regenAllBtn.disabled = false;
                            regenAllBtn.innerHTML = origHtml;
                        });
                });
            }
        })();
    </script>
