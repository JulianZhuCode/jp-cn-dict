<!DOCTYPE html>
<html layout:decorate="~{admin/layout}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <title>语法管理</title>
</head>

<body>

<main layout:fragment="content">
    <th:block th:replace="~{admin/fragments/data-table :: table(
        title='语法',
        description='管理日语语法条目',
        createUrl='#',
        createModal='grammar-modal',
        createPermission='dict:grammar:create',
        items=${grammars},
        emptyMessage='未找到语法',
        baseUrl='/admin/dict/grammars',
        page=${page},
        colspan=5,
        headers=~{::#grammar-headers},
        rows=~{::#grammar-row},
        filter=~{::#grammar-filter}
    )}">
        <th:block id="grammar-filter">
            <div class="row g-2">
                <div class="col-md-5">
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-search"></i></span>
                        <input class="form-control dict-search-input" id="grammarSearchInput"
                               placeholder="搜索语法条目、读音..."
                               th:value="${keyword}" type="text">
                        <button class="btn btn-outline-secondary" id="grammarSearchClear" style="display:none"
                                type="button">
                            <i class="bi bi-x-lg"></i>
                        </button>
                    </div>
                </div>
            </div>
        </th:block>
        <th:block id="grammar-headers">
            <th>语法条目</th>
            <th>读音</th>
            <th>含义</th>
            <th>备注</th>
            <th>操作</th>
        </th:block>
        <th:block id="grammar-row">
            <td><strong th:text="${item.word}">〜たい</strong></td>
            <td th:text="${item.reading}">〜たい</td>
            <td>
                <span th:each="m,iterStat : ${item.meaning}"
                      th:if="${item.meaning != null and #arrays.length(item.meaning) > 0}"
                      th:text="${m + (iterStat.last ? '' : ', ')}">want to</span>
                <span th:unless="${item.meaning != null and #arrays.length(item.meaning) > 0}">-</span>
            </td>
            <td>
                <span th:each="n,iterStat : ${item.notes}"
                      th:if="${item.notes != null and #arrays.length(item.notes) > 0}"
                      th:text="${n + (iterStat.last ? '' : ', ')}">attached to masu-stem</span>
                <span th:unless="${item.notes != null and #arrays.length(item.notes) > 0}">-</span>
            </td>
            <td class="d-flex gap-2">
                <button class="btn btn-outline-primary btn-sm"
                        data-modal="grammar-modal" th:attr="data-edit-id=${item.id}"
                        th:if="${#sets.contains(userAuthorities, '*') or #sets.contains(userAuthorities, 'dict:grammar:update')}">
                    编辑
                </button>
                <button class="btn btn-outline-danger btn-sm"
                        th:attr="data-delete-api='/api/grammars',data-delete-id=${item.id},data-delete-name=${item.word}"
                        th:if="${#sets.contains(userAuthorities, '*') or #sets.contains(userAuthorities, 'dict:grammar:delete')}">
                    删除
                </button>
            </td>
        </th:block>
    </th:block>

    <!-- Grammar Modal (Bootstrap 5) -->
    <div aria-hidden="true" class="modal fade" id="grammar-modal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">创建语法</h5>
                    <button aria-label="Close" class="btn-close" data-bs-dismiss="modal" type="button"></button>
                </div>
                <form class="dict-modal-form" data-api-base="/api/grammars">
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label" for="grammar-word">语法条目</label>
                            <input class="form-control" id="grammar-word" name="word" required type="text">
                            <div class="invalid-feedback" data-field="word"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="grammar-reading">读音</label>
                            <input class="form-control" id="grammar-reading" name="reading" type="text">
                            <div class="invalid-feedback" data-field="reading"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="grammar-meaning">含义（逗号分隔）</label>
                            <input class="form-control" id="grammar-meaning" name="meaning" type="text">
                            <div class="invalid-feedback" data-field="meaning"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="grammar-notes">备注（逗号分隔）</label>
                            <input class="form-control" id="grammar-notes" name="notes" type="text">
                            <div class="invalid-feedback" data-field="notes"></div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button class="btn btn-secondary" data-bs-dismiss="modal" type="button">取消</button>
                        <button class="btn btn-primary modal-submit" type="button">保存</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script th:inline="javascript">
        (function () {
            var searchInput = document.getElementById('grammarSearchInput');
            var clearBtn = document.getElementById('grammarSearchClear');
            var DEBOUNCE_MS = 400;
            var searchTimer = null;

            function doSearch() {
                var keyword = searchInput ? searchInput.value.trim() : '';
                var params = new URLSearchParams(window.location.search);
                if (keyword) params.set('keyword', keyword);
                else params.delete('keyword');
                params.delete('page');
                window.location.href = '/admin/dict/grammars?' + params.toString();
            }

            function updateClearBtn() {
                if (clearBtn) {
                    clearBtn.style.display = searchInput.value ? '' : 'none';
                }
            }

            if (searchInput) {
                updateClearBtn();
                searchInput.addEventListener('input', function () {
                    updateClearBtn();
                    clearTimeout(searchTimer);
                    searchTimer = setTimeout(doSearch, DEBOUNCE_MS);
                });
                searchInput.addEventListener('keydown', function (e) {
                    if (e.key === 'Enter') {
                        clearTimeout(searchTimer);
                        doSearch();
                    }
                });
            }

            if (clearBtn) {
                clearBtn.addEventListener('click', function () {
                    searchInput.value = '';
                    updateClearBtn();
                    clearTimeout(searchTimer);
                    doSearch();
                });
            }
        })();
    </script>
</main>

</body>
</html>
